<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="도시 이름으로 확인하는 지금의 날씨">
  <title>지금, 날씨</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231c4bc4'/%3E%3Ccircle cx='16' cy='16' r='8' fill='%23ffdc78'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main>
    <header><span class="eyebrow">YOUR DAILY WEATHER</span><h1>지금, 날씨<span>.</span></h1><p>궁금한 도시의 하늘을 확인해 보세요.</p></header>
    <form id="weather-form">
      <label for="city">도시 이름</label>
      <div class="search-row"><input id="city" name="city" type="text" placeholder="예: 서울, 부산, London" minlength="2" maxlength="100" required autocomplete="off"><button type="submit">날씨 확인</button></div>
      <p class="hint">같은 이름의 도시가 있으면 가장 먼저 검색된 지역을 보여드려요.</p>
    </form>
    <p id="status" role="status" aria-live="polite">도시를 입력하면 현재 날씨가 여기에 표시됩니다.</p>
    <section id="weather" aria-label="현재 날씨" hidden>
      <div class="weather-heading"><div><span class="eyebrow">현재 날씨</span><h2 id="location"></h2><p id="region"></p></div><span id="weather-icon" aria-hidden="true"></span></div>
      <div class="temperature-row"><span id="temperature"></span><span id="description"></span></div>
      <dl><div><dt>체감 온도</dt><dd id="feels-like"></dd></div><div><dt>습도</dt><dd id="humidity"></dd></div><div><dt>풍속</dt><dd id="wind"></dd></div></dl>
      <p id="updated" class="hint"></p>
    </section>
    <footer>날씨 데이터 <a href="https://open-meteo.com/" target="_blank" rel="noopener noreferrer">Open-Meteo</a> · 위치 데이터 <a href="https://www.geonames.org/" target="_blank" rel="noopener noreferrer">GeoNames</a><p>현재 날씨는 기상 모델 기반의 추정 정보입니다.</p></footer>
  </main>
</body>
</html>
